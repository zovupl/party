<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0713" />
  <title>🎉 Party</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>" />
</head>
<body>
  <div id="app" style="color:#a99fc4;padding:24px;text-align:center">Загрузка…</div>
  <script>
    // Временный перехватчик ошибок — показывает причину вместо пустого экрана.
    function __showErr(label, detail) {
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<pre style="color:#fff;background:#300;padding:16px;margin:12px;'
        + 'border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5">'
        + '⚠️ ' + label + '\n\n' + String(detail).replace(/</g, '&lt;') + '</pre>';
    }
    window.addEventListener('error', function (e) {
      var d = (e.error && e.error.stack) || (e.message || e.type) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
      __showErr('Ошибка загрузки', d);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason || {};
      __showErr('Ошибка (promise)', r.stack || r.message || r);
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
